<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RGB Matrix Control Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <style>
        .pixel-preview {
            image-rendering: pixelated;
            background-color: #000;
            border: 1px solid #444;
            width: 128px;
            height: 64px;
            object-fit: contain;
        }
    </style>
</head>
<body class="bg-body-tertiary">
    <nav class="navbar navbar-expand-lg bg-dark border-bottom border-secondary mb-3">
        <div class="container">
            <a class="navbar-brand fw-bold text-info" href="{{ url_for('web.index') }}">64x32 Matrix Daemon</a>
            <div class="navbar-nav me-auto flex-row gap-3">
                <a class="nav-link {% if request.endpoint == 'web.index' %}active text-white fw-semibold{% endif %}"
                   href="{{ url_for('web.index') }}">Dashboard</a>
                <a class="nav-link {% if 'sequence' in request.endpoint %}active text-warning fw-semibold{% endif %}"
                   href="{{ url_for('web.sequences_overview') }}">Sequence Editor</a>
            </div>
            <button class="btn btn-outline-danger btn-sm"
                    hx-post="{{ url_for('web.ui_display_clear') }}"
                    hx-target="#status-banner"
                    hx-swap="outerHTML">
                Clear Matrix
            </button>
        </div>
    </nav>

    <main class="container pb-5">
        <div id="status-banner" class="mb-3">
            <div class="alert alert-secondary py-2 mb-0">
                <strong>Matrix Status:</strong> Active ({{ matrix_engine.active_label if matrix_engine is defined else 'Ready' }})
            </div>
        </div>
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
